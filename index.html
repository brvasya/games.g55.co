<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./preloader.css">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
</head>

<body>
<div id="preloader">
<div class="preloader-panel">
<div class="preloader-title">LOADING</div>
<div class="preloader-bar">
<div id="preloaderFill"></div>
</div>
<div id="preloaderText">0%</div>
</div>
</div>
<div id="hud">
<div id="crosshair"></div>
<div class="cs-topbar">
<div class="cs-badge">ENEMIES <span id="enemiesLeft"></span></div>
<div class="cs-score">$<span id="score"></span></div>
<div class="cs-round">WAVE <span id="wave"></span></div>
</div>
<div class="cs-bottom-left">
<div class="cs-label">HEALTH</div>
<div class="cs-big"><span id="health"></span></div>
</div>
<div class="cs-bottom-right">
<div class="cs-label">
<span id="weaponSlot"></span> · 
<span id="weaponName"></span>
</div>
<div class="cs-ammo">
<span id="ammo"></span>
<small>/ <span id="reserve"></span></small>
</div>
</div>
</div>
<div id="damageFlash"></div>
<div id="overlay">
<div id="panel">
<h1></h1>
<p>Use WASD to move, mouse to aim, click to shoot, F for fullscreen.</p>
<button id="startButton" class="cs-button">Start Game</button>
</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
